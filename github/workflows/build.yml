name: Build Android APK

on:
  workflow_dispatch:   # يسمح بتشغيل البناء يدوياً من تبويب Actions
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential ccache \
            libltdl-dev

      - name: Use Java 17 for Android Gradle plugin
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/temurin-17-jdk-amd64/bin" >> "$GITHUB_PATH"

      - name: Install buildozer and Cython
        run: |
          pip install --upgrade "pip==24.0"
          pip install "cython<3.0" buildozer

      - name: Pin pip version for nested build environments
        run: |
          echo "pip==24.0" > /tmp/pip-constraints.txt
          echo "PIP_CONSTRAINT=/tmp/pip-constraints.txt" >> "$GITHUB_ENV"

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medasava-apk
          path: bin/*.apk
